# Static site — no build step, no framework. The repo root is published as-is.
[build]
  publish = "."

# The audit form posts to /success. Netlify's pretty URLs already map this to
# success.html; the rewrite makes it explicit so the action can never 404.
[[redirects]]
  from = "/success"
  to = "/success.html"
  status = 200

# Self-hosted fonts are content-hashed by filename and never change in place.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
